[plugin]

name="Rect Tile Painter"
description="Click-and-drag rectangle painting for TileMapLayer. Picks tiles procedurally from a 4x4 region of the tileset via a name->coord dictionary, or in Sum mode unions/subtracts drags into one re-tiled terrain shape out of an 8x6 region. Editor only."
author="Zach Cardwell"
version="2.0"
script="rect_tile_painter.gd"
